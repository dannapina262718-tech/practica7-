<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

<!-- MENÚ DE NAVEGACIÓN -->
<nav>
    <a class="logo" href="index.html">
        <img src="../static/imgs/nebula-03.svg" alt="Logo Nébula" width="100">
    </a>
    <input type="checkbox" id="menu-triple">
    <label for="menu-triple" class="menu-button">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="iniciar-sesion.html">Iniciar Sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
    </ul>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<main class="auth-container">
    <section class="auth-card">

        <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
            <h1>Crear cuenta</h1>

            <!-- Nombre completo -->
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text"
                       id="nombre"
                       name="nombre"
                       placeholder="Danna Piña"
                       required
                       maxlength="100"
                       minlength="10">
            </div>

            <!-- Correo -->
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email"
                       id="correo"
                       name="correo"
                       required
                       placeholder="correo@dominio.com"
                       minlength="5">
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label for="contrasenia">Contraseña</label>
                <input type="password"
                       id="contrasenia"
                       name="contrasenia"
                       placeholder="pin"
                       required
                       autocapitalize="off">
            </div>

            <!-- Pseudónimo -->
            <div class="form-group">
                <label for="pseudonimo">Nombre de usuario (Ej: Nebula-2025)</label>
                <input type="text"
                       placeholder="Nebula-2025"
                       required
                       id="pseudonimo"
                       name="pseudonimo"
                       pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                       title="Debe incluir de 3 a 10 letras, un guión (-) y de 2 a 10 números">
            </div>

            <!-- Género -->
            <div class="form-group">
                <label>Género</label>
                <div class="radio-group">
                    <input type="radio" id="radio_femenino" name="genero" value="femenino" required>
                    <label for="radio_femenino">Femenino</label>

                    <input type="radio" id="radio_masculino" name="genero" value="masculino">
                    <label for="radio_masculino">Masculino</label>

                    <input type="radio" id="radio_otro" name="genero" value="otro">
                    <label for="radio_otro">Otro</label>
                </div>
            </div>

            <!-- Tipo de Suscripción -->
            <div class="form-group">
                <label for="suscripcion">Tipo de Suscripción</label>
                <select id="suscripcion" name="suscripcion" required>
                    <option value="">------ Selecciona una opción ------</option>
                    <option value="gratis">Gratis</option>
                    <option value="premium_mensual">Premium mensual: $99 al mes</option>
                    <option value="premium_anual">Premium anual: $899 al año</option>
                </select>
            </div>

            <!-- Fecha de nacimiento -->
            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de nacimiento</label>
                <input type="date"
                       id="fecha_nacimiento"
                       name="fecha_nacimiento"
                       required>
            </div>

            <!-- Términos y condiciones -->
            <div class="form-group checkbox-group">
                <input type="checkbox" id="terminos" value="Aceptado" required name="terminos">
                <label for="terminos">Acepto los términos y condiciones de usuario</label>
            </div>

            <!-- Comentarios -->
            <div class="form-group">
                <label for="comentarios">Comentarios o gustos</label>
                <textarea id="comentarios"
                          name="comentarios"
                          rows="4"
                          placeholder="Cuéntanos qué música te gusta"></textarea>
            </div>

            <!-- Botones -->
            <button type="submit" class="btn-primary">Crear cuenta</button>
            <button type="reset" class="btn-secondary">Limpiar Formulario</button>

            <br><br>
            <p>¿Ya tienes cuenta? <a href="iniciar-sesion.html">Iniciar sesión</a></p>
        </form>

    </section>
</main>

<!-- PIE DE PÁGINA -->
<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
