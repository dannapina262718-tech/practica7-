<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <h1>Crear cuenta</h1>

                <div>
                    <label for="nombre">
                        Nombre Completo
                    </label>
                    <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Danna Piña"
                    required
                    maxlength="100"
                    minlength="10"
                    >
                </div>

                <div>
                    <label for="correo">
                        Correo electroinico
                    </label>
                    <input
                    type="email"
                    id="correo"
                    name="correo"
                    required
                    placeholder="correo@dominio.com"
                    minlength="5">
                </div>

                <div>
                    <label for="contrasenia">
                        Contraseña
                    </label>
                    <input
                    type="password"
                    id="contrasenia"
                    name="contrasenia"
                    placeholder="pin"
                    required
                    autocapitalize="off">
                </div>

                <div>
                    <label for="pseudonimo">
                        Nombre de usuario
                    </label>
                    <input
                    type="text"
                    placeholder="Nevula-2025"
                    required
                    id="pseudonimo"
                    name="pseudonimo"
                    pattern="[a-zA-Z]-[0-9][2-10]"
                    minlength="6"
                    >
                </div>

                <div>

                    <label Genero></label>

                    <input
                        type="radio"
                        id="radio_femenino"
                        name="genero"
                        value="femenino"
                        required
                    >
                    <label for="radio_femenino">
                        Femenino
                    </label>
                    <input
                            type="radio"
                            id="radio_masculino"
                            name="genero"
                            value="masculino"
                    >
                    <label for="radio_masculino">
                        Masculino
                    </label>
                    <input
                            type="radio"
                            id="radio_otro"
                            name="genero"
                            value="otro"
                    >
                    <label for="radio_otro">
                        Otro
                    </label>
                </div>

                <div>
                    <label for="suscripcion">Tipo de Suscriopcion</label>
                    <select id="suscripcion" name="suscripcion" required>
                        <option value="">
                            ------selecciona una opcion-------
                        </option>
                        <option value="gratis">
                            Gratis
                        </option>
                        <option value="premiun_mensual">
                            Premiun mensual: 99$ al mes
                        </option>
                        <option value="premiun_anual">
                            Premiun Anual: $899 al año
                        </option>
                    </select>
                </div>

                <div>
                    <label for="fecha_nacimento">Fecha de nacimiento</label>
                    <input
                    type="date"
                    id="fecha_nacimento"
                    required
                    name="fecha_nacimiento">
                </div>

                <div>
                    <input type="checkbox" id="terminos" value="Aceptado" required name="terminos">
                    <label for="terminos">
                        Acepto los terminos y condiciones de usuario
                    </label>

                </div>

                <div>
                    <label for="comentarios">
                        Comentarios o gustos
                    </label>
                </div>
                <div>
                    <textarea id="comentarios"
                              name="comtarios"
                            rows="4"
                            cols="40"
                            placeholder="Cuentanos que musica te gusta">

                    </textarea>
                </div>

                <div>
                    <button type="submit">
                        Crear cuenta
                    </button>

                    <button type="reset">
                        Limpiar Formulario
                    </button>

                </div>

                <p>Ya tienes cuenta? <a href="iniciar-sesion.html">Iniciar sesion</a></p>
            </form>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
